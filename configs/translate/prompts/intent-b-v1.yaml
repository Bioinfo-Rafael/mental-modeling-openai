# Policy-input translation prompt (code session: the model reads weights W and replayed activations A
# with Python in the sandbox and ends with one ```json answer). Byte-identical to the former
# intent-b-v1 prompt; tests/fixtures/intent-b-v1-goldens.json pins it. Vars: language_instruction,
# limits_line. Literal braces are doubled ({{ }}). primary_instruction words the target's own
# instruction, or its absence at a start without one (a case the recorded runs never had).
schema_version: 1
version: intent-b-v1
protocol: code_session
output_schema: null
system: null
user: |
  A neural network policy called "{policy_alias}" flies aircraft {target_aircraft}. State its current intent at decision step {step} (time {t_s:g} s): what it is trying to achieve and how. You do not see the world. You see only the policy: its trained weights and, for every step of the window, the observation it read, every intermediate activation and the actions it chose (validated replay values). Nothing after the current step is available.

  # Task of the policy
  {policy_task}

  # Context
  - Aircraft: {target_aircraft} (team A; its teammate runs its own copy of the same network).
  - Current step: {step} (time {t_s:g} s). Window: steps {window_start} through {window_end} inclusive ({window_length} decisions, {step_seconds:g} s apart).
  - Human instruction in effect (context only; the policy does not read it, so do not assume it is followed): {primary_instruction}

  # Previous translation for this aircraft (yours, from the same method)
  {previous_translation}

  # How you work
  - Every reply must be EITHER a ```python code block, which is executed and whose output you receive
    in the next message, OR your final answer (with no ```python block at all). Prefer exactly one
    block per reply: several blocks are merged in order into ONE run and count as one run.
  - A reply with neither a code block nor a complete final answer is a protocol error.
  - Each code block runs in a fresh Python 3 process with numpy. Preloaded: `np` (numpy), `json`,
    `W` (dict: parameter name -> float32 array, see Parameters) and `A` (dict: activation name ->
    array with a leading axis of {window_length} rows, one per window step, oldest first; see
    Activations). Files you write under /work persist between runs; /work/weights is read-only.
    There is no network and no other data.
  - stdout is truncated to {stdout_cap_chars} characters; the last {stderr_tail_chars}
    characters of stderr are shown; each run is killed after {timeout_s} s.
  - You may execute at most {max_runs} code blocks. Print compact summaries, not whole arrays.

  # Rules (strict)
  - Use only W, A and the information in this message.
  - A holds validated replay values for this aircraft over the stated causal window (the network was
    replayed on the recorded observations from h = 0 and matches the recorded logits and states).
  - A['h_prev'] of the first row summarises the policy's own history before the window; it is not
    world data.
  - You may compute statistics, temporal differences and any linear algebra directly on W and A.
  - You may exactly reconstruct one recorded step of one block from its recorded direct inputs and W
    (linear maps, ReLU, sigmoid, tanh, softmax and LayerNorm included), only to verify or
    algebraically decompose the matching value in A (e.g. per-unit contributions to a logit, input
    vs recurrent parts of a gate). With LayerNorm, a decomposition at the row's fixed mean/variance
    is algebra, not a causal attribution.
  - Do not pass perturbed, scaled, interpolated, averaged, zeroed or hand-built vectors through any
    layer. Do not modify W or A, or use other weights, observations or hidden states.
  - Do not compute gradients, finite differences, ablations or counterfactuals; do not iterate the
    recurrence or synthesize another trajectory.
  - Do not import torch, any other deep-learning or automatic-differentiation library, or search
    for anything. Your code is audited for these rules.
  - Base every evidence item on named A/W keys, absolute steps and numbers you computed.

  {policy_architecture}

  {policy_inputs}

  {policy_outputs}

  # Activations (keys of A, read-only; float32 unless stated, {window_length} rows)
  {policy_activations}
  Row i of every array is the same decision. `h_prev` of the first row is the state carried in from before the window (zero only if the window starts at step 0). Probabilities are exact softmaxes of the recorded logits; ties within ~1e-4 in the logits are numerical ties.

  {policy_parameters}

  # Final answer
  When you are done, reply WITHOUT any ```python block and with exactly one ```json block:
  {{"intent": "<the aircraft's current intent: what it is trying to achieve and how, at most {max_intent_chars} characters>",
   "evidence": ["<short observation from the weights or activations that supports the intent, citing steps,
   activation names and values>", ...]}}
  {limits_line}Treat the intent as a hypothesis supported by evidence; do not invent missile targets, hits,
  cooperation or outcomes. {language_instruction} Text outside the ```json block is ignored.
blocks:
  primary_instruction:
    present: '{text}'
    empty: '(none: no instruction is in effect)'
  previous_translation:
    present: |-
      From step {step}:
      intent: {intent}
      evidence:
      {evidence}
      Keep what still holds and revise what the newer steps contradict.
    evidence_item: '  - {item}'
    evidence_joiner: |2+

    empty: '(none: this is the first translation for this aircraft)'
turns:
  run_result:
    header: 'OUTPUT of run {run_index} of at most {max_runs} ({status}):'
    status_exit: exit code {exit_code}
    status_timed_out: TIMED OUT
    merged_note: 'Note: your reply had {blocks} ```python blocks; they were merged into this one run.'
    truncated_note: (stdout was truncated)
    stderr_header: 'stderr (tail):'
    runs_remaining: 'Runs remaining: {remaining}.'
    no_runs_remaining: 'No runs remain: reply with your final answer now.'
  protocol_error:
    text: |-
      Your reply had neither a ```python code block nor a well-formed final answer. Missing:
      {problems}
      Reply with a ```python block to run code, or with the complete final answer and no ```python block.
      {remaining}
    problem_item: '- {problem}'
    runs_remaining: 'Runs remaining: {remaining}.'
    no_runs_remaining: 'No runs remain: reply with your final answer.'
  budget_exhausted: The code-execution budget is used up. Reply with your final answer now, with no ```python block.
