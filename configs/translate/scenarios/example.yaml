# Example scenario: PLACEHOLDER TEXT ONLY. Never commit real instructions; real scenarios live in the
# gitignored private/ tree (pass one with --scenario).
# Every target is translated at step 0 (start), with or without an instruction in effect, and at
# every question to it (request). Instructions and alarms never trigger a translation: they are
# prompt context and detector input. Rules: ids unique; steps in [0, last complete step] (340 for
# this episode); "to" lists only targets listed in targets; at most one question per target per step.
id: example-01                     # never shown to a model
episode: ../../../data/mhi/processed/mhi_v1.3_ic100601_win.csv   # relative to this file
targets: [aircraft:A0100, aircraft:A0200, team:A]
messages:                          # each revealed at its step, never earlier
  - {id: instruction-001, step: 0, kind: instruction, to: [aircraft:A0100], text: "[PLACEHOLDER] Perform the assigned single-aircraft task."}
  - {id: question-001, step: 10, kind: question, to: [aircraft:A0100], text: "[PLACEHOLDER] What is aircraft A0100 trying to do now?"}
  - {id: alarm-001, step: 12, kind: alarm, to: [aircraft:A0100], text: "[PLACEHOLDER] Missile warning for aircraft A0100."}
  - {id: instruction-002, step: 20, kind: instruction, to: [team:A], text: "[PLACEHOLDER] Switch to the revised team task."}
