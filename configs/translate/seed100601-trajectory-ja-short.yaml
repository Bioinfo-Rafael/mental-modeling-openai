# Trajectory input, short Japanese answers (as the former run seed100601-ja-short).
# Inputs: the scenario texts, the previous translation and the 60-step trajectory window (lag17-jsonl).
# Prompt: configs/translate/prompts/translator-intent-v2.yaml (one Responses call, strict JSON answer).
# python -m translate --config configs/translate/seed100601-trajectory-ja-short.yaml   (preview; add --execute --confirm-paid-api to send)
schema_version: 2
scenario: configs/translate/scenarios/seed100601-neutral.yaml
triggers:
  source: preset                    # the steps chosen in advance, each with its kind (start | change | request)
  tick_interval_steps: null
  points:                           # kinds are assumptions for the reproduction (the recorded runs had none); edit freely
    - {step: 45, kind: start, targets: null}       # null: every instructed target
    - {step: 145, kind: change, targets: null}
    - {step: 245, kind: change, targets: null}
    - {step: 315, kind: change, targets: null}
visibility: {mode: online, future_steps: 0}
limits: {max_detector_calls: 1, max_translation_calls: 8}
scenario_limits: {max_instruction_chars: 300, max_alarm_chars: 200, max_question_chars: 200}
detector: null                      # preset triggers: no change-point detector
inputs: [instructions, alarms, question, previous_translation, trajectory]
trajectory: {renderer: lag17-jsonl, past_steps: 60}   # recorded in every event (judge material)
prompt:
  file: configs/translate/prompts/translator-intent-v2.yaml
  vars:
    output_language: Japanese
    limits_paragraph: "\n\nLength limits (counted in characters, not bytes; a longer answer is rejected): intent at most 200 characters; at most 4 evidence items, each at most 80 characters."
translation: {backend: openai_responses, model: gpt-6.1-sol, reasoning_effort: high, max_output_tokens: 25000, timeout_s: 1800, retry: default}
answer: {max_intent_chars: 200, max_evidence_items: 4, max_evidence_chars: 80, on_invalid: skip}
output: {root: outputs/translate}
pricing:                            # USD per 1M tokens, preview cost estimate only (list price; re-check)
  gpt-6.1-sol: {input: 2.00, cached_input: 0.10, output: 10.00}
