# Example Translator scenario (schema v2): PLACEHOLDER TEXT ONLY. Never commit real instructions.
# Real scenarios live under the gitignored private/translator/ directory.
# Paths resolve relative to this file. Rules: at least one instruction at step 0; ids unique across
# instructions, alarms and requests; steps in [0, last complete step] (340 for this episode); at most
# one instruction and at most one request per exact target per step; an alarm or request needs every
# target to have an instruction at or before its step; texts within configs/translator/run.yaml
# scenario_limits; the alias is lowercased and split into alphanumeric tokens: no token may be an
# outcome word (win, loss, lose, won, lost), and no token may be shared with the episode id.
# A target is translated at its first instruction (trigger "initial") and at each request; otherwise
# only when the detector reports "start" or "change". A later instruction (team A at step 20) only
# reaches the detector state. Change-point references for evaluation live in the evaluation
# annotation, never here.
schema_version: 2
scenario_id: placeholder-episode-01
episode:
  episode_id: mhi_v1.3_ic100601_win
  alias: episode_01                 # neutral alias; the only episode name a model sees
  csv_path: ../../data/mhi/processed/mhi_v1.3_ic100601_win.csv
  video_path: ../../data/mhi/action_videos/mhi_v1.3_ic100601_win_with_actions.mp4
instructions:
  - instruction_id: placeholder-aircraft-001
    issue_step: 0
    target: {kind: aircraft, id: A0100}
    text: "[PLACEHOLDER] Perform the assigned single-aircraft task."
  - instruction_id: placeholder-team-001
    issue_step: 0
    target: {kind: team, id: A}
    text: "[PLACEHOLDER] Perform the assigned team task."
  - instruction_id: placeholder-team-002
    issue_step: 20
    target: {kind: team, id: A}
    text: "[PLACEHOLDER] Switch to the revised team task."
alarms:                             # external warnings; each reaches every target sharing an aircraft with its targets
  - alarm_id: placeholder-alarm-001
    step: 12
    targets: [{kind: aircraft, id: A0100}]
    text: "[PLACEHOLDER] Warning about the situation of aircraft A0100."
requests:                           # a human asks; the question goes to each target's translation
  - request_id: placeholder-request-001
    step: 10
    targets: [{kind: aircraft, id: A0100}]
    source: placeholder-human
    question: "[PLACEHOLDER] What is aircraft A0100 trying to do now?"
