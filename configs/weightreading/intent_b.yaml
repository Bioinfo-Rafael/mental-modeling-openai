# Method B of the intent-translation comparison (python -m weightreading intent-preview|intent-run).
# Same format as run.yaml. The shared configs/intent_compare/compare.yaml decides seed, steps,
# targets, window, instruction, model and reasoning effort; `model` and `reasoning_effort` here must
# equal it (the run is refused otherwise). Paid calls still need `intent-run --execute --confirm-paid-api`.

backend: openai-responses        # OpenAI Responses API, no tools passed to the model
model: gpt-6.1-sol               # must equal compare.yaml `model`
reasoning_effort: high           # must equal compare.yaml `reasoning_effort`
task_mode: shown                 # intent-B always shows the task and the I/O semantics

limits:                          # per (step, aircraft) session
  max_runs: 12                   # code executions per session
  max_output_tokens: 25000       # per model turn (as method A for reasoning_effort high)
  # Billed input + output across one session; the loop stops when exceeded. A request is only sent
  # while the session total is below this, so every request's input stays below it plus one run
  # result (<= 26.4k tokens even at one token per char): < 272k, the long-context price threshold.
  max_total_tokens: 240000
  max_protocol_errors: 3         # consecutive malformed replies before the session stops

sandbox:                         # as run.yaml
  python: .venv/bin/python
  timeout_s: 600
  memory_bytes: 8589934592
  file_size_bytes: 1073741824
  stdout_cap_chars: 20000
  stderr_tail_chars: 6000
  tmp_size_mb: 512
  threads: 4
  work_max_bytes: 2147483648

# USD per 1M tokens, used only for the local cost preview.
# Source: evaluation/config/judge-text.yaml `pricing.gpt-6.1-sol` (list price; requests above 272k
# input tokens cost 2x input / 1.5x output, which max_total_tokens above avoids). Re-check before paid runs.
pricing:
  gpt-6.1-sol: {input: 2.00, cached_input: 0.10, output: 10.00}
