# The LLM judge (python -m evaluation judge --run <translation run>). One gpt-6.1-sol call per
# translation event, rated on the criteria of the event's point kinds (start, change, request). The
# judge sees the same human-visible material for every translation, whatever the translator read.
# Omitted keys take their defaults (src/evaluation/README.md); unknown and duplicate keys fail.
model: {name: gpt-6.1-sol, reasoning_effort: medium, max_output_tokens: 25000}   # D8; timeout_s default 1800
material:
  past_steps: 60                   # the human-visible trajectory window [t-59, t] (lag17 JSON lines)
  future_steps: 120                # FUTURE for start/change events: steps after t, cut at the next
                                   # instruction or alarm to the target, its down step, or here
  future_stride: 5                 # one FUTURE line every 5 steps (1 s)
  fields: [alive, state_valid, lon_deg, lat_deg, alt_m, yaw_deg, tas_mps, vn_mps, ve_mps, vu_mps,
           altitude_action_id, heading_action_id, speed_action_id]   # FUTURE columns
rubric_version: pilot-5            # bump whenever criteria, anchors or scale change; part of every
                                   # request (the verdict schema's name), so a bump is a new request
rationale_language: Japanese       # D57
scale:                             # D53 pilot scale; humans and the judge alike
  values: ["1", "2", "3", "4", "5"]   # ordered; also the categories of the weighted kappa
  cannot_judge: 判定に必要な記録がパケットに無い（例：FUTURE が「(no step inside the window)」で計画と照合できない）。説明があいまい・空であるのは低い点であり、判定不能ではない。not_evaluated として記録し、0点とは扱わない
  not_applicable: 条件付きの基準だけ。場面にその要素が無い、またはそのデータが無い（例：INSTRUCTIONS IN EFFECT が none なので「指示との関係」は不要）。条件付きの基準では判定不能より優先する。not_evaluated として記録
timing: {request_deadline_s: 3.0}  # D55: a request event passes when processing_s <= this (report.json)
limits: {max_calls: 100}           # per invocation; the run stops before call max_calls + 1 (exit 4)
output: outputs/evaluation         # <output>/<translation run>/<name>/; every request under it is never resent
prompt:  # UTF-8 files, relative to this config; placeholders are checked at load.
  system_file: prompts/judge/system.txt
  user_file: prompts/judge/user.txt
  rating_rule_file: prompts/judge/rating_rule.txt
  future_file: prompts/judge/future.txt
# Criteria (D65 anchors, ids and anchors of rubric pilot-5): kinds = the point kinds whose events are
# rated on it; the aspect is the id prefix. conditional: true allows not_applicable (its text is
# required); cannot_judge narrows the general boundary; may_use_future: true marks the criteria that
# may read the FUTURE block. The score is the LOWEST level whose condition holds.
criteria:
  - id: elements.what_now
    kinds: [start, change, request]
    text: "今何をしているかが述べられているか"
    levels:
      "5": "OUTPUT に現在の行動を述べる語句があり、行動の種類に加えて方向・高度・速度・相手のいずれかを含む（例：「B0100 に機首を向けて接近している」）"
      "4": "行動の種類（接近・旋回・上昇・降下・離脱・追尾など）を述べる語句はあるが、方向・高度・速度・相手のどれも含まない（例：「接近している」）"
      "3": "行動の種類を述べる語句は無いが、evidence か他の文に現在の行動を一つに特定できる事実がある（例：evidence の「B0100 との距離 12→8 km」だけ）"
      "2": "行動に関係する語はあるが、行動の種類が無く、行動を一つに特定できる事実も無い（例：「状況に応じて対応している」）"
      "1": "現在の行動に触れていない（目的や将来の計画だけ、または OUTPUT が空）"
  - id: elements.why
    kinds: [start, change, request]
    text: "なぜそうするか（近い将来に実現したい状況を含めてよい）が述べられているか"
    levels:
      "5": "OUTPUT に目的を述べる語句があり、目的の種類に加えて実現したい近い将来の状況を機体 id・方向・距離・射程などで述べている（例：「B0100 の後方に回り込み、先に射程に入れるため」）"
      "4": "目的の種類（攻撃・射程確保・回避・離脱・支援・指示への対応など）を述べる語句はあるが、実現したい状況を機体 id・方向・距離・射程のどれでも述べていない（例：「攻撃のため」「回避するため」）"
      "3": "目的の種類を述べる語句は無いが、OUTPUT の中で行動と目指す状態の因果関係が明示されている（例：「降下して B0200 のミサイルの射程から出る」）"
      "2": "目的に関係する語はあるが、目的の種類も、行動と目指す状態の因果関係も無い（例：「有利な状況を作るため」「最適な行動として」）"
      "1": "理由にも目指す状況にも触れていない（行動の描写だけ、または OUTPUT が空）"
  - id: elements.target
    kinds: [start, change, request]
    conditional: true
    text: "誰を狙っているか"
    levels:
      "5": "OUTPUT が狙う相手を機体 id、または材料から一機に定まる呼称で述べている（例：「B0100 を狙っている」）"
      "4": "狙う相手を絞る語句はあるが一機に定まらない（例：「敵機」「前方の敵」で候補が 2 機ある）"
      "3": "狙う相手を述べる語句は無いが、evidence か他の文に相手を一機に特定できる事実がある（例：evidence に「B0100 との距離が縮小」だけ）"
      "2": "「目標」「ターゲット」などの語はあるが、相手を絞る語句も、一機に特定できる事実も無い"
      "1": "狙う相手に触れていない"
    not_applicable: "敵機が全機 alive=0、または対象の行動が敵を狙うものではない（帰投・回避だけなど）"
  - id: elements.wingman_role
    kinds: [start, change, request]
    conditional: true
    text: "僚機との役割分担"
    levels:
      "5": "OUTPUT が自機と僚機それぞれの役割を述べている（例：「A0100 が B0100 を引きつけ、A0200 が側方から B0200 を狙う」）"
      "4": "自機か僚機の一方の役割だけを述べている（例：「A0200 が援護する」）"
      "3": "役割を述べる語句は無いが、evidence か他の文に両機それぞれの行動を特定できる事実がある（例：evidence に両機の進路が別々に書かれているだけ）"
      "2": "「僚機と連携」などの語はあるが、どちらが何をするかを特定できる語句も事実も無い"
      "1": "僚機に触れていない"
    not_applicable: "僚機が alive=0、または対象が単機で僚機の記録が WINDOW に無い"
  - id: elements.instruction_relation
    kinds: [start, change, request]
    conditional: true
    text: "指示との関係"
    levels:
      "5": "OUTPUT が指示の内容に言及し（引用・要約・発行 step のいずれか）、従う・一部従う・従わないのどれかを述べている（例：「指示『B0100 を優先』に従い B0100 を追う」）"
      "4": "従う・従わないは述べているが、指示の内容に言及していない（例：「指示どおり接近」）"
      "3": "関係を述べる語句は無いが、OUTPUT が有効な指示の語句と同じ行動・相手を述べており、一致を特定できる（例：指示「B0100 を追え」に対し「B0100 に接近」とだけ述べる）"
      "2": "「指示を考慮」などの語はあるが、従うのか従わないのかを特定できる語句も事実も無い"
      "1": "指示に触れていない"
    not_applicable: "INSTRUCTIONS IN EFFECT が none"
  - id: elements.priority
    kinds: [start, change, request]
    conditional: true
    text: "重視点"
    levels:
      "5": "OUTPUT が優先するものと、そのために後回しにするものの両方を述べている（例：「B0100 への攻撃より回避を優先」）"
      "4": "優先するものだけを述べ、何より優先するのかが無い（例：「生存を優先」）"
      "3": "優先を述べる語句は無いが、OUTPUT の中で選ぶ行動と見送る行動の対比が明示されている（例：「接近せずに降下する」）"
      "2": "「バランスよく」「最適に」など、何を重視するかも行動の対比も無い語だけがある"
      "1": "重視点に触れていない"
    not_applicable: "ALARMS も INSTRUCTIONS IN EFFECT も none で、WINDOW に同時に別々の対応を求める二つ以上の相手・事象が無い（例：生存している敵が 1 機だけで警報も無い）"
  - id: correctness.start_plan
    kinds: [start]
    text: "これから何を、何のためにするかが説明されているか"
    levels:
      "5": "これからの行動（何を）と目的（何のため）の両方を OUTPUT から引用でき、両方とも機体 id・方向・位置関係などで特定でき、量・程度・時間の表現も含めて WINDOW・INSTRUCTIONS・ALARMS と食い違わない（例：「正面の B0100 に接近し射程に入れる」で、WINDOW でも B0100 が前方にいる）"
      "4": "行動と目的の両方を引用でき、相手・方向・原因は記録と食い違わないが、一方が特定できない一般語である（例：「有利な位置へ」）か、量・程度・時間の表現だけがずれる"
      "3": "行動か目的の一方しか述べていない、または相手・方向・原因のうちちょうど 1 件が記録と食い違う（例：「北へ向かう」だが WINDOW の yaw_deg は南へ変化中）"
      "2": "計画を特定できない（現在の様子の描写や一般論だけ）、または相手・方向・原因のうち 2 件以上が記録と食い違う"
      "1": "OUTPUT が空、または主な行動か目的が記録と反対（例：「B0100 を攻撃」だが B0100 は WINDOW で alive=0）"
  - id: correctness.start_future
    kinds: [start]
    may_use_future: true
    text: "説明した計画と FUTURE ブロック内の実際の行動が一致するか（FUTURE は次の外的要因・変化点の前で切れている）"
    levels:
      "5": "説明した行動の要素（方向・高度・速度・相手への接近）がすべて FUTURE の *_action_id か状態の推移で確かめられ、量・程度の表現もずれない（例：「B0100 に機首を向けて接近」→ FUTURE で yaw_deg が B0100 の方へ変わり距離が縮む）"
      "4": "要素はすべて確かめられるが、量・程度の表現だけがずれる（例：「急降下」だが altitude_action_id=2 は 1 行だけで alt_m の減少は 200 m）"
      "3": "方向・高度・速度・相手のうちちょうど 1 要素が FUTURE と食い違う（反対ではない。例：「右旋回」だが heading_action_id は 2（直進）が続く）"
      "2": "2 要素以上が FUTURE と食い違う（どれも反対ではない）"
      "1": "OUTPUT に FUTURE と照合できる行動の要素が無い、いずれかの要素が FUTURE と反対（例：「接近」だが距離が開き続ける）、または説明した行動が FUTURE の中で一度も始まらない"
    cannot_judge: "FUTURE に行が無い、または B チームの対象で状態の推移からも行動を判別できない。FUTURE の終端より後の行動は根拠にしない"
  - id: contribution.intent_gap
    kinds: [start]
    text: "自分の意図とAIの意図のずれに気づきやすくなるか"
    levels:
      "5": "必要な三点（AI が選んだ行動または相手、その目的、選ばなかった選択肢か指示との一致・相違）がすべて OUTPUT にあり、三点とも機体 id・方向・step・指示の語句などで一つに特定でき、記録と食い違わない（例：「指示どおり B0100 を優先し、B0200 は A0200 に任せる」）"
      "4": "三点はすべてあり、記録と食い違わないが、少なくとも一点が一つに特定できない（例：「指示に沿って攻撃を優先」で、どの指示・どの相手か分からない）"
      "3": "三点のうちちょうど一点が欠けており、記録と食い違わない"
      "2": "二点以上が欠けている、または場面に固有の内容が無く、記録と食い違わない"
      "1": "記録と反対の意図を示すなど、読んだ人がずれを見誤る記述がある（例：接近しているのに「離脱中」）"
  - id: contribution.next_plan
    kinds: [start, change]
    text: "次の計画を理解しやすくなるか"
    levels:
      "5": "必要な三点（次の行動、その相手か方向、切り替えの条件か次の段階）がすべて OUTPUT にあり、三点とも一つに特定でき、記録と食い違わない（例：「B0100 に接近し、射程に入ったら発射、外れたら左旋回で離脱」）"
      "4": "三点はすべてあり、記録と食い違わないが、少なくとも一点が一つに特定できない（例：「接近して状況を見て離脱」）"
      "3": "三点のうちちょうど一点が欠けており、記録と食い違わない（例：「B0100 に接近する」だけで、その後が無い）"
      "2": "二点以上が欠けている、または場面に固有の内容が無い（例：「状況に応じて対応」）"
      "1": "記録と食い違う計画を示し、次の行動を見誤らせる記述がある"
  - id: contribution.delegation
    kinds: [start, change, request]
    text: "任せる・確認する・指示するの判断がしやすくなるか"
    levels:
      "5": "必要な四点（行動、相手、目的、続ける・やめる条件）がすべて OUTPUT にあり、四点とも一つに特定でき、記録と食い違わない（例：「B0100 を射程に入れるため接近。警報が出たら降下して離脱」）"
      "4": "四点はすべてあり、記録と食い違わないが、少なくとも一点が一つに特定できない"
      "3": "四点のうちちょうど一点が欠けており、記録と食い違わない"
      "2": "二点以上が欠けている、または場面に固有の内容が無い"
      "1": "危険を安全と述べる、無い指示の反映を主張するなど、記録と食い違い判断を誤らせる記述がある"
  - id: correctness.change_cause
    kinds: [change]
    text: "以前の意図を当てはまらなくした外的要因（警報・観測された事象・人の指示など）を特定し、それが記録と一致するか"
    levels:
      "5": "外的要因が ALARMS・INSTRUCTIONS・WINDOW の記録と一致し、step か内容でどの記録か特定でき、それによって PREVIOUS の意図が当てはまらなくなったことを述べている（例：「step 312 のミサイル警報で B0100 への接近を続けられなくなった」）"
      "4": "外的要因の種類（警報・指示・観測）は記録と一致するが、どの記録か特定できない、または時刻の表現がずれる"
      "3": "外的要因の種類が記録と違う（警報を指示と述べるなど）、または記録に無い要因をちょうど 1 件挙げている。記録上の要因を否定はしていない"
      "2": "記録にある外的要因を挙げず、記録に無い要因を 2 件以上挙げている"
      "1": "外的要因に触れていない（計画どおりの進行としてだけ述べる場合を含む）、または記録上の要因が起きていないと否定している（例：警報が出ているのに「警報なしで旋回」）"
    cannot_judge: "以前の意図を当てはまらなくした警報・指示・観測事象がパケットのどこにも無い（例：観測事象が WINDOW の最初の行より前に起きた）"
  - id: correctness.change_delta
    kinds: [change]
    conditional: true
    text: "以前の計画から何を変更したかが説明されているか"
    levels:
      "5": "変更前と変更後の両方を一つに特定できる形で述べ、変更前が PREVIOUS の内容と一致する（例：PREVIOUS「B0100 に接近」→「B0100 への接近をやめ、降下して離脱に切り替える」）"
      "4": "変更前と変更後を区別して述べ、変更前は PREVIOUS と食い違わないが、ちょうど一方が一つに特定できない（例：「今までの行動をやめ、B0200 から離脱」）"
      "3": "変更後か変更前の一方だけを述べている、または両方とも一つに特定できない（例：「計画を切り替えた」）"
      "2": "変更前と変更後が区別できない（新しい計画が PREVIOUS と同じ内容）"
      "1": "変更に触れていない、または変更前として述べた内容が PREVIOUS と矛盾する"
    not_applicable: "PREVIOUS が無い（この対象の最初の説明）"
  - id: correctness.change_future
    kinds: [change]
    may_use_future: true
    text: "新しい計画が FUTURE ブロックの記録と矛盾しないか"
    levels:
      "5": "新しい計画の要素（方向・高度・速度・相手への接近）がすべて FUTURE の *_action_id か状態の推移で確かめられ、量・程度の表現もずれない（例：「警報を受けて高度を下げ離脱」→ FUTURE で altitude_action_id=2 が続き alt_m が下がり、相手との距離が開く）"
      "4": "要素はすべて確かめられるが、量・程度の表現だけがずれる"
      "3": "方向・高度・速度・相手のうちちょうど 1 要素が FUTURE と食い違う（反対ではない）"
      "2": "2 要素以上が FUTURE と食い違う（どれも反対ではない）"
      "1": "OUTPUT に FUTURE と照合できる行動の要素が無い、いずれかの要素が FUTURE と反対、新しい行動が FUTURE の中で一度も始まらない、または FUTURE の中で PREVIOUS の行動に戻っている"
    cannot_judge: "FUTURE に行が無い、または B チームの対象で状態の推移からも行動を判別できない。FUTURE の終端より後の行動は根拠にしない"
  - id: timing.change_in_time
    kinds: [change]
    may_use_future: true
    text: "人が対応できる時点までに説明でき、短い揺れや重複を報告しすぎていないか（TIMELINE と FUTURE を参照）"
    levels:
      "5": "C が 0 で（原因の後、この説明が同じ対象の最初の説明）、新しい行動は t より前に WINDOW で始まっておらず、FUTURE の中で続いている"
      "4": "C が 0 だが、新しい行動は t より前に WINDOW で始まっている（後追いだが最初の報告）。行動は FUTURE の中で続いている"
      "3": "C が 1（一度見送ってからの報告、または同じ変化の 2 回目の報告）。行動は FUTURE の中で続いている"
      "2": "C が 2 以上。行動は FUTURE の中で続いている"
      "1": "t が原因の step s より前、原因か新しい行動を特定できない、または報告した変化が FUTURE の中で PREVIOUS の行動に戻る（持続しない短い揺れ）"
    cannot_judge: "FUTURE に行が無く、新しい行動が続くかを確かめられない"
  - id: contribution.change_reason
    kinds: [change]
    text: "変化の理由を理解しやすくなるか"
    levels:
      "5": "必要な二点（原因となった警報・指示・観測、その原因で何をやめ何を始めたか）がどちらも OUTPUT にあり、step・機体 id・指示の語句などで一つに特定でき、記録と食い違わない（例：「step 312 のミサイル警報を受け、B0100 への接近を中断して降下回避に切り替えた」）"
      "4": "二点ともあり、記録と食い違わないが、少なくとも一方が一つに特定できない（例：「警報を受けて回避に切り替えた」で、警報が複数ある）"
      "3": "二点のうちちょうど一方が欠けており、記録と食い違わない（例：原因だけ、または切り替えた行動だけ）"
      "2": "二点とも欠けている、または場面に固有の内容が無い（例：「状況が変わったため」）"
      "1": "記録と食い違う原因を挙げるなど、変化の理由を見誤らせる記述がある"
  - id: contribution.instruction_reflected
    kinds: [change]
    text: "指示が反映されたか確認しやすくなるか"
    levels:
      "5": "必要な三点（どの指示か、反映したかしなかったか、どの行動で反映したか）がすべて OUTPUT にあり、三点とも一つに特定でき、記録と食い違わない（例：「指示『B0100 を優先』を反映し、B0100 への接近を継続」）"
      "4": "三点はすべてあり、記録と食い違わないが、少なくとも一点が一つに特定できない（例：「指示を反映して接近中」で、有効な指示が複数ある）"
      "3": "三点のうちちょうど一点が欠けており、記録と食い違わない"
      "2": "二点以上が欠けている、または場面に固有の内容が無い（例：「指示に配慮」）"
      "1": "反映していない指示を反映したと述べるなど、記録と食い違い確認を誤らせる記述がある"
    cannot_judge: "INSTRUCTIONS IN EFFECT が none（確認する指示がパケットに無い）"
  - id: correctness.question_granularity
    kinds: [request]
    text: "質問に対応する粒度で答えているか"
    levels:
      "5": "質問の型（なぜ・何を・誰を・いつまで）に直接答える文が intent の最初の文にあり、問われたすべての点に答え、問われていない話題を加えていない（例：質問「なぜ左旋回？」→「B0200 の後方に回り込むため」）"
      "4": "問われたすべての点に直接答えているが、答えが intent の最初の文ではない、または問われていない一般的な説明が付いている"
      "3": "複数の問われた点のうちちょうど一点に答えていない"
      "2": "質問の対象には触れるが、型が合わない（「なぜ」に「何をしているか」で答える）、または問われた点に答えない現状の説明だけ"
      "1": "OUTPUT が空か拒否だけ、または質問を取り違えている（別の機体について答える）"
  - id: correctness.records_to_t
    kinds: [request]
    text: "回答が時刻 t 以前の記録と一致するか"
    levels:
      "5": "回答の誰・何・向き・原因の主張がすべて WINDOW・ALARMS・INSTRUCTIONS と一致し、量・程度・時間の表現もずれない"
      "4": "誰・何・向き・原因はすべて一致し、量・程度・時間の表現だけがずれる（例：「高度を大きく下げた」だが alt_m の差は 100 m）"
      "3": "誰・何・向き・原因のうちちょうど 1 件が記録と食い違う、または記録と照合できる主張が一つも無い（一般論だけ）"
      "2": "誰・何・向き・原因のうち 2 件以上が記録と食い違う"
      "1": "主な目的が記録と反対、または別の対象について述べている"
  - id: correctness.unknown_not_asserted
    kinds: [request]
    text: "記録から判断できない内容を断定せず「分からない」と扱えているか"
    levels:
      "5": "記録で確かめられない内容を述べていない、または述べる場合は「不明」「推定」「記録からは分からない」と明示している"
      "4": "記録で確かめられない内容を「〜とみられる」など推測と読める形で述べているが、「不明」「推定」の明示語は無い"
      "3": "主な主張（質問への直接の答え）以外の部分で、記録で確かめられない内容を事実として断定している箇所がちょうど 1 件ある（例：「B0100 は燃料切れで離脱」— 燃料は記録に無い）"
      "2": "主な主張以外の部分で、そのような断定が 2 件以上ある"
      "1": "主な主張（質問への直接の答え）そのものが記録で確かめられない断定である（例：敵の意図や RL の内的理由を事実として断定）"
  - id: correctness.consistent_with_latest
    kinds: [request]
    conditional: true
    text: "最新の説明と不必要に矛盾していないか"
    levels:
      "5": "行動・相手・目的と量・程度・時間の表現が PREVIOUS と食い違わない（言い回しの違いは問わない）、または食い違う点を PREVIOUS の step より後の WINDOW・ALARMS・INSTRUCTIONS の記録を挙げて更新として述べている"
      "4": "行動・相手・目的は PREVIOUS と同じで、量・程度・時間の表現だけが理由なく違う（例：PREVIOUS「6000 m まで降下」→ 回答「4000 m まで降下」）"
      "3": "行動・相手・目的のうちちょうど 1 件が PREVIOUS と違い、その理由を述べていない（反対の意図ではない）"
      "2": "2 件以上が PREVIOUS と違い、その理由を述べていない（反対の意図ではない）"
      "1": "PREVIOUS と反対の意図を、PREVIOUS の step より後の WINDOW・ALARMS・INSTRUCTIONS に根拠が無いまま述べている"
    not_applicable: "PREVIOUS が無い（この対象の最初の説明）"
  - id: timing.request_in_time
    kinds: [request]
    may_use_future: true
    text: "問いを受けてから十分速く応答できたか（processing_s を参照）"
    levels:
      "5": "TIMELINE のこの説明の processing_s が 3.0 秒以下で、t が QUESTION の step q と同じ"
      "4": "processing_s が 3.0 秒以下で t が q より後、かつ D =（t − q）× 0.2 秒 + processing_s が 10.0 秒未満"
      "3": "processing_s が 3.0 秒を超えるが、D が 10.0 秒未満"
      "2": "t が q と同じで、D（= processing_s）が 10.0 秒以上"
      "1": "t が q より後で、D が 10.0 秒以上（応答の開始も遅れ、次の質問が来うる時刻までに返せていない）"
    cannot_judge: "TIMELINE のこの説明に processing_s が無い"
  - id: contribution.question_resolved
    kinds: [request]
    text: "疑問が解消されるか"
    levels:
      "5": "必要な二点（質問への直接の答え、その根拠となる記録上の事実）がどちらも OUTPUT にあり、step・機体 id・記録値などで一つに特定でき、記録と食い違わない（例：質問「なぜ左旋回？」→「B0200 の後方に回り込むため。B0100 は A0200 が担当している」）"
      "4": "二点ともあり、記録と食い違わないが、根拠が一つに特定できない（例：「敵の位置関係から」）"
      "3": "直接の答えはあるが根拠が無い、または根拠らしき事実だけで直接の答えが無い。記録と食い違わない"
      "2": "二点とも無い、または場面に固有の内容が無い"
      "1": "記録と食い違う答えなど、疑問を誤った方向に解消させる記述がある"
