[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtd-rl-xavier"
version = "0.1.0"
description = "Config-driven intent translation of RL agents (translate) and its LLM-as-a-judge evaluation (evaluation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=1.24,<3",
  "openai>=1,<3",
  "pandas>=2,<4",
  "PyYAML>=6",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
# Video-window rendering for the LLM judge (frame decoding, resize, JPEG).
video = ["av>=17,<20", "Pillow>=12,<14"]

[dependency-groups]
dev = ["pytest>=7,<9", "ruff>=0.8", "poethepoet>=0.29"]

# Core only: the translation pipeline (translate) and the judges (evaluation). The legacy LLM-Xavier
# stack is the separate uv project in the workspace directory.
# The explicit package-dir keeps the editable install from putting all of src/ on sys.path (a .pth entry).
[tool.setuptools]
# Subpackages are listed explicitly because `find` would map "" -> src and bring the .pth back;
# tests/test_core_boundary.py fails when this list misses a package directory.
packages = [
  "translate",
  "translate.lag",
  "translate.llm",
  "translate.policy",
  "translate.sandbox",
  "evaluation",
]

[tool.setuptools.package-dir]
translate = "src/translate"
evaluation = "src/evaluation"

[tool.setuptools.package-data]
evaluation = ["README.md", "examples/*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
# Core tests only. The workspace directory is a separate uv project with its own test session.
testpaths = ["tests"]
# The repository root makes the `tests.<area>` helper modules importable.
pythonpath = ["."]
python_files = ["test_*.py"]
norecursedirs = [".*", "results", "node_modules", "__pycache__", "*.egg-info", "workspace"]

[tool.ruff]
target-version = "py310"
line-length = 120
# The independent workspace project is not linted or formatted from here,
# even when a file path is passed explicitly (e.g. by editor hooks).
force-exclude = true
extend-exclude = [
  "workspace",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Frozen request-path file (tests/test_frozen_moves.py): its import order is pinned with its bytes.
"src/evaluation/assess_data.py" = ["I001"]

[tool.poe.tasks]
test = { cmd = "pytest", help = "Core tests (translate, evaluation)" }
lint = { cmd = "ruff check src tests scripts", help = "Lint both packages, their tests and scripts" }
