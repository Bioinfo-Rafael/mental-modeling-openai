[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtd-rl-xavier"
version = "0.1.0"
description = "Intent translation of RL agents (Translator, comparison methods A and B) and its LLM-as-a-judge evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=1.24,<3",
  "openai>=1,<3",
  "pandas>=2,<4",
  "PyYAML>=6",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
# Video-window rendering for the LLM judge (frame decoding, resize, JPEG).
video = ["av>=17,<20", "Pillow>=12,<14"]

[dependency-groups]
dev = ["pytest>=7,<9", "ruff>=0.8", "poethepoet>=0.29"]

# Core only: the Translator library (mtd_rl_xavier), method B (weightreading) and the judge
# (evaluation). The legacy LLM-Xavier stack is the separate uv project in the workspace directory.
# The explicit package-dir keeps the editable install from putting all of src/ on sys.path (a .pth entry).
[tool.setuptools]
# Subpackages are listed explicitly because `find` would map "" -> src and bring the .pth back;
# tests/test_core_boundary.py fails when this list misses a package directory.
packages = [
  "mtd_rl_xavier",
  "mtd_rl_xavier.intent_compare",
  "mtd_rl_xavier.lag",
  "mtd_rl_xavier.llm",
  "mtd_rl_xavier.tools",
  "mtd_rl_xavier.translator",
  "weightreading",
  "evaluation",
]

[tool.setuptools.package-dir]
mtd_rl_xavier = "src/mtd_rl_xavier"
weightreading = "src/weightreading"
# The LLM judge stays at the repository root (its provenance keys and default config paths name
# `evaluation/`); installing it makes `python -m evaluation.*` work from any directory.
evaluation = "evaluation"

[tool.setuptools.package-data]
evaluation = ["README.md", "config/*.yaml", "examples/*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
# Core tests only. The workspace directory is a separate uv project with its own test session.
testpaths = ["tests"]
# The repository root makes the `tests.<area>` helper modules importable.
pythonpath = ["."]
python_files = ["test_*.py"]
norecursedirs = [".*", "results", "node_modules", "__pycache__", "*.egg-info", "workspace"]

[tool.ruff]
target-version = "py310"
line-length = 120
# The independent workspace project is not linted or formatted from here,
# even when a file path is passed explicitly (e.g. by editor hooks).
force-exclude = true
extend-exclude = [
  "workspace",
  # Rescued byte-identical (its SHA-256 is recorded in the converted Translator run): never reformat.
  "src/mtd_rl_xavier/intent_compare/to_translator_run.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.poe.tasks]
test = { cmd = "pytest", help = "Core tests (Translator, methods A/B, judge)" }
lint = { cmd = "ruff check src tests evaluation", help = "Lint the library, its tests and the evaluation package" }
