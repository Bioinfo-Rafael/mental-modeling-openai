[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-modeling-openai-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "openai>=1,<3",
  "tiktoken>=0.7",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
data = ["huggingface_hub>=0.26", "pandas>=2", "pyulog>=1.2", "scipy>=1.11"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "upstream/LLM-Xavier"]

[tool.setuptools]
packages = ["tools", "dataset_adapters", "preprocessing"]
