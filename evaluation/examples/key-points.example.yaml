# Example judge key points: PLACEHOLDER TEXT ONLY. Never commit real key points.
# Real key points live under the gitignored private/evaluation/ directory.
#
# Partial judging (D36): list only the translation events to judge. Each event_id must name a
# translation_event in the Translator run's events.jsonl (unknown or duplicate ids fail before any
# call); every other event is recorded as not_judged with no API call. Per event: a non-empty list
# of key points, ids unique within the event (letters, digits, '.', '_', '-'), non-blank text.
# The scale is fixed in code (D29): 2 = core purpose and main action reproduced, 1 = partial,
# 0 = missing or a different purpose; plus an overall 1-5 score.
#
# These ids match a run of configs/translator/scenario.example.yaml (scenario placeholder-episode-01).
schema_version: 1
events:
  - event_id: placeholder-episode-01:aircraft:A0100:000000
    key_points:
      - key_point_id: kp-001
        text: "[PLACEHOLDER] The core purpose that the translation should reproduce."
      - key_point_id: kp-002
        text: "[PLACEHOLDER] The main action or motion that the translation should mention."
  - event_id: placeholder-episode-01:aircraft:A0100:000010
    key_points:
      - key_point_id: kp-001
        text: "[PLACEHOLDER] The purpose behind the motion at the request point."
