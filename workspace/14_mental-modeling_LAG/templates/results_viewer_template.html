<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 LAG — 入出力ビューア</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:1520px;padding:28px;color:#172333;background:#f4f7fb;font:14px/1.65 system-ui,sans-serif;overflow-wrap:anywhere}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:8px 0 14px}.muted{color:#5e6b7c}.panel,.controls{background:white;border:1px solid #d7e0ed;border-radius:12px;padding:20px;margin:16px 0}.filters,.nav,.quick,.view-switch{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.filters{align-items:end}.nav,.quick{margin-top:14px}label{display:flex;flex-direction:column;font-weight:600;gap:4px}select,button,input{font:inherit;border:1px solid #b9c6d8;border-radius:7px;padding:7px 10px;background:white;color:inherit}select{max-width:300px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#2457cf;color:white;border-color:#2457cf}a{color:#2457cf}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace;margin:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid #e1e7ef;text-align:left;vertical-align:top}th{background:#edf3ff}.scroll{overflow:auto}.pill{padding:5px 10px;background:#edf3ff;border-radius:7px}.good{background:#e0f5e8;color:#145b33}.bad{background:#fee7e7;color:#912424}.warning{background:#fff2d8;color:#755219}summary{cursor:pointer;font-weight:600}details pre{margin-top:12px}.search{min-width:260px}.view-switch{margin:16px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.stat{background:white;padding:14px 18px;border:1px solid #d7e0ed;border-radius:10px}.stat strong{display:block;font-size:25px}.stat span{color:#5e6b7c}.paired{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.paired article{min-width:0;padding:16px;border:1px solid #d7e0ed;background:#f7f9fc;border-radius:8px}.paired article.selected{border-color:#2457cf;box-shadow:inset 0 3px #2457cf}.paired pre{max-height:440px;overflow:auto}.paired h3{display:flex;justify-content:space-between;gap:8px}.paired h3 small{font-weight:500;color:#5e6b7c}.scope-label{margin:20px 0 10px;font-size:15px}.response-panel{border-left:4px solid #2468a2}.truth-panel{border-left:4px solid #65a9ca}.answer-table{min-width:1900px;table-layout:fixed}.answer-table .answer{width:530px}.answer-table .condition{width:160px}.answer-table .short{width:100px}.answer-table .truth{width:230px}.list-scroll{max-height:75vh;overflow:auto}.list-scroll thead th{position:sticky;top:0;z-index:1}.answer-table tbody tr:nth-child(even){background:#f7f9fc}.pager{display:flex;gap:12px;align-items:center;margin:12px 0}[hidden]{display:none!important}.meta-table th{width:230px}.notice{border-left:4px solid #e19e25}.section-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}.empty{padding:32px;text-align:center;color:#5e6b7c}:focus-visible{outline:3px solid #77a7ef;outline-offset:2px}@media(max-width:800px){body{padding:12px}.panel,.controls{padding:14px}.paired{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.filters label{max-width:100%}select,input,.search{max-width:100%;min-width:0}.nav #query{max-width:100%;width:100%}.meta-table th{width:140px}}
</style></head><body>
<h1>14 LAG · Raw input / output viewer</h1>
<p class="muted" id="overview"></p>
<div class="stats" id="stats"></div>
<p class="muted">3モデル × 3試合 × 2機体 × 5種類のH × 4課題 × 2入力範囲 × 5問。行動は3成分の一致、状態は10成分それぞれの誤差で評価します。</p>
<nav class="view-switch" aria-label="表示タイプ"><button id="detail-view" class="primary" aria-pressed="true">詳細表示</button><button id="list-view" aria-pressed="false">回答一覧</button><button id="compare-view" aria-pressed="false">3モデル・入力範囲の比較</button></nav>
<div class="controls"><div class="filters" id="filters"></div>
<div class="quick"><span id="result-count" role="status" aria-live="polite"></span><button id="reset">絞り込み解除</button></div>
<div id="detail-controls"><div class="nav"><button id="previous">← 前へ</button><span id="position" class="pill"></span><button id="next" class="primary">次へ →</button><select id="query" aria-label="回答を選択"></select><button id="download">この回答をJSON保存</button></div>
<div class="section-links" id="links"><a href="#answer-start">回答</a><a href="#truth-start">予測と正解</a><a href="#input-start">入力全文</a><a href="#metadata-start">条件・時間・token</a></div></div></div>
<main id="content"></main>
<noscript>表示にはJavaScriptを有効にしてください。外部通信は行いません。</noscript>
<script id="dataset" type="application/json">__DATASET__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent),rows=data.rows,$=id=>document.getElementById(id);
const names={match:'行動：一致',mismatch:'行動：不一致',state_scored:'状態：誤差算出済み',parse_error:'出力を解析できず',api_error:'APIエラー',pending:'送信予約・結果未回収',unstarted:'未送信'};
const scopes={self:'self（対象機体のみ）',all_aircraft_missiles:'全機体＋ミサイル'};
const fields={episode_id:'試合',target_id:'対象機体',H:'履歴 H',task:'課題',observation_scope:'入力範囲',model_alias:'モデル',sample_number:'問題番号 (0–4)',status:'結果'};
const sample=r=>data.samples[r.sample_id],answer=r=>r.raw_response?.choices?.[0]?.message?.content??null;
const responseStatuses=new Set(['match','mismatch','state_scored','parse_error']);
const rowById=new Map(rows.map(r=>[r.query_id,r])),pairs=new Map();
for(const r of rows){if(!pairs.has(r.comparison_id))pairs.set(r.comparison_id,[]);pairs.get(r.comparison_id).push(r)}
let filtered=rows,index=0,view='detail',page=0;const pageSize=25,promptSearch=new Map();
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function value(v){return v===undefined||v===null?'—':typeof v==='object'?JSON.stringify(v,null,2):String(v)}
function caption(k,v){if(k==='status')return names[v]||v;if(k==='observation_scope')return scopes[v]||v;return String(v)}
function panel(title,id){const p=el('section');p.className='panel';p.id=id;p.append(el('h2',title));return p}
function textPanel(title,text,collapsed=false){const p=el(collapsed?'details':'section');p.className='panel';p.append(el(collapsed?'summary':'h2',title),el('pre',text));return p}
function badge(r){const p=el('span',names[r.status]);p.className='pill '+(r.status==='match'?'good':['mismatch','api_error','parse_error'].includes(r.status)?'bad':r.status==='pending'?'warning':'');return p}
function describe(r){return `${r.model_alias} / ${r.episode_id} / ${r.target_id} / H${r.H} / ${r.task} / ${scopes[r.observation_scope]} / 問${r.sample_number} / step${r.target_step}`}
function numeric(v){return typeof v==='number'?Number(v.toPrecision(9)).toString():value(v)}
function promptText(r){if(!promptSearch.has(r.sample_id))promptSearch.set(r.sample_id,sample(r).messages.map(m=>m.content).join('\n').toLowerCase());return promptSearch.get(r.sample_id)}
for(const [key,title] of Object.entries(fields)){
 const label=el('label',title),select=el('select');select.id=key;select.append(new Option('すべて',''));
 const vals=[...new Set(rows.map(r=>r[key]))];if(['H','sample_number'].includes(key))vals.sort((a,b)=>a-b);
 for(const v of vals)select.append(new Option(caption(key,v),v));select.onchange=apply;label.append(select);$('filters').append(label);
}
const availableLabel=el('label','表示対象'),available=el('select');available.id='availability';
for(const [title,v] of [['応答あり','saved'],['計画全件','all'],['結果未回収・未送信','waiting']])available.append(new Option(title,v));available.onchange=apply;availableLabel.append(available);$('filters').append(availableLabel);
const searchLabel=el('label','ID・入力・回答を検索'),search=el('input');search.type='search';search.id='search';search.className='search';search.placeholder='query ID / 入力・回答中の語句';let searchTimer;search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(apply,150)};searchLabel.append(search);$('filters').append(searchLabel);
$('overview').textContent=`${data.created_at_jst} 時点 · ${data.run} · 保存済みデータのスナップショット。オフライン表示・API送信なし。`;
const saved=rows.filter(r=>responseStatuses.has(r.status)).length,pending=rows.filter(r=>r.status==='pending').length,unstarted=rows.filter(r=>r.status==='unstarted').length,errors=rows.filter(r=>r.status==='api_error').length;
for(const [title,count] of [['計画',rows.length],['応答保存済み',saved],['結果未回収',pending],['未送信',unstarted],['APIエラー',errors]]){const card=el('div');card.className='stat';card.append(el('strong',count.toLocaleString()),el('span',title));$('stats').append(card)}
function apply(){const term=search.value.trim().toLowerCase();filtered=rows.filter(r=>Object.keys(fields).every(k=>!$(k).value||String(r[k])===$(k).value)&&(available.value==='all'||(available.value==='saved'?responseStatuses.has(r.status):['pending','unstarted'].includes(r.status)))&&(!term||[r.query_id,answer(r),r.episode_id].some(v=>String(v??'').toLowerCase().includes(term))||promptText(r).includes(term)));index=0;page=0;fillOptions();render()}
function fillOptions(){$('query').replaceChildren();filtered.forEach((r,i)=>$('query').append(new Option(`${i+1}. ${describe(r)}`,i)))}
function reset(){for(const k of Object.keys(fields))$(k).value='';available.value='all';search.value='';apply()}
function openRow(id){if(!filtered.some(r=>r.query_id===id))reset();index=filtered.findIndex(r=>r.query_id===id);view='detail';render();$('content').scrollIntoView({block:'start'})}
function table(headers,entries){const wrap=el('div');wrap.className='scroll';const t=el('table'),head=el('thead'),tr=el('tr');for(const h of headers){const th=el('th',h);th.scope='col';tr.append(th)}head.append(tr);const body=el('tbody');for(const row of entries){const line=el('tr');for(const v of row)line.append(el('td',value(v)));body.append(line)}t.append(head,body);wrap.append(t);return wrap}
function truthPanel(r){const s=sample(r),p=panel('予測と正解','truth-start');p.classList.add('truth-panel');
 const action=r.task.endsWith('action');p.append(el('p',action?'行動3成分のIDを比較します。':'状態10成分の誤差です。単位が異なるため、全成分を平均した正誤判定は行いません。'));
 const entries=s.prediction_fields.map((f,i)=>[f,numeric(r.scoring?.prediction?.[i]),numeric(s.ground_truth[i]),action?(r.scoring?.component_matches?.[f]===undefined?'—':r.scoring.component_matches[f]?'一致':'不一致'):numeric(r.scoring?.absolute_errors?.[f]),...(action?[]:[numeric(r.scoring?.circular_angle_errors_deg?.[f])])]);
 p.append(table(action?['成分','予測','正解','判定']:['成分','予測','正解','絶対誤差','角度の循環誤差 (deg)'],entries));if(r.scoring?.parse_error)p.append(el('p',`解析エラー: ${r.scoring.parse_error}`));return p}
function renderComparison(r){const p=panel('同じ問題の比較 · 3モデル × 2入力範囲','pair-start');p.append(el('p',`${r.episode_id} / ${r.target_id} / H${r.H} / ${r.task} / 問${r.sample_number} / step${r.target_step}`),el('p','モデル・入力範囲の絞り込みにかかわらず、同じ履歴範囲と正解時点の6回答を表示します。'));
 const matched=pairs.get(r.comparison_id)||[];
 for(const scope of ['self','all_aircraft_missiles']){p.append(el('h3',scopes[scope]));const grid=el('div');grid.className='paired';
 for(const model of ['sol','terra','luna']){const q=matched.find(x=>x.model_alias===model&&x.observation_scope===scope),card=el('article');if(q?.query_id===r.query_id)card.className='selected';card.append(el('h3',model));if(q){card.append(badge(q),el('p',`予測: ${value(q.scoring?.prediction)}\n正解: ${value(sample(q).ground_truth)}`),el('pre',answer(q)??'応答なし'));const button=el('button','この回答の詳細');button.onclick=()=>openRow(q.query_id);card.append(button)}else card.append(el('p','対応する計画なし'));grid.append(card)}p.append(grid);}
 $('content').append(p)}
function renderDetail(r){const s=sample(r),p=panel('出力 — assistant text','answer-start');p.classList.add('response-panel');p.append(el('p',describe(r)),badge(r),el('pre',answer(r)??'応答は保存されていません。'));if(r.error)p.append(el('pre',`${r.error_type}: ${r.error}`));$('content').append(p,truthPanel(r));
 const inputs=panel('入力全文','input-start');inputs.append(el('p',r.status==='unstarted'?'保存済み計画の送信予定プロンプトです。':'保存済み計画と送信記録の一致を検証したプロンプトです。'));for(const message of s.messages){const d=el('details');d.append(el('summary',message.role),el('pre',message.content));inputs.append(d)}$('content').append(inputs);
 const usage=r.raw_response?.usage||{},meta=panel('条件・時間・token','metadata-start');meta.append(table(['項目','値'],[['モデルID',r.model],['送信方法',r.transport],['入力tokens',usage.prompt_tokens],['出力tokens（推論を含む）',usage.completion_tokens],['うち推論tokens',usage.completion_tokens_details?.reasoning_tokens],['cached input tokens',usage.prompt_tokens_details?.cached_tokens],['cache write tokens',usage.prompt_tokens_details?.cache_write_tokens],['API経過秒',r.elapsed_seconds],['送信／予約時刻',r.started_at],['応答保存時刻',r.finished_at],['Batch ID',r.batch_id],['履歴開始step',r.start],['予測対象step',r.target_step],['query ID',r.query_id],['sample ID',r.sample_id],['生成設定',data.request_options]]),el('p','BatchのAPI経過秒は未計測です。推論tokensは出力tokensの内訳で、別途加算しません。'));$('content').append(meta,textPanel('応答原文 JSON',value(r.raw_response),true),textPanel('スナップショットの出典',value({plan_id:data.plan_id,scoring_version:data.scoring_version,...data.sources}),true))}
function renderList(){const p=panel(`回答一覧 · ${filtered.length}件`,'answer-list');const controls=el('div');controls.className='pager';const back=el('button','前の25件'),next=el('button','次の25件');back.disabled=page===0;next.disabled=(page+1)*pageSize>=filtered.length;back.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};controls.append(back,el('span',`${page*pageSize+1}–${Math.min((page+1)*pageSize,filtered.length)} / ${filtered.length}`),next);p.append(controls);
 const scroll=el('div');scroll.className='list-scroll';const t=el('table');t.className='answer-table';const head=el('thead'),tr=el('tr');const columns=[['詳細','short'],['assistant text（全文）','answer'],['モデル','short'],['試合・機体','condition'],['H・課題','condition'],['入力範囲','condition'],['問・step','short'],['結果','condition'],['予測','truth'],['正解','truth']];for(const [label,cls]of columns){const th=el('th',label);th.className=cls;th.scope='col';tr.append(th)}head.append(tr);const body=el('tbody');
 filtered.slice(page*pageSize,(page+1)*pageSize).forEach(r=>{const tr=el('tr'),cell=el('td'),button=el('button','詳細');button.onclick=()=>openRow(r.query_id);cell.append(button);tr.append(cell);const answerCell=el('td');answerCell.append(el('pre',answer(r)??'応答なし'));tr.append(answerCell);for(const v of [r.model_alias,`${r.episode_id}\n${r.target_id}`,`H${r.H} / ${r.task}`,scopes[r.observation_scope],`${r.sample_number} / step${r.target_step}`,names[r.status],r.scoring?.prediction,sample(r).ground_truth])tr.append(el('td',value(v)));body.append(tr)});t.append(head,body);scroll.append(t);p.append(scroll);$('content').append(p)}
function render(){for(const name of ['detail','list','compare']){$(`${name}-view`).className=view===name?'primary':'';$(`${name}-view`).setAttribute('aria-pressed',String(view===name))}$('detail-controls').hidden=view==='list';$('links').hidden=view!=='detail';$('result-count').textContent=`該当 ${filtered.length.toLocaleString()} / 全 ${rows.length.toLocaleString()}件`;const r=filtered[index];$('content').replaceChildren();$('position').textContent=r?`${index+1} / ${filtered.length}`:'0件';$('previous').disabled=!r||index===0;$('next').disabled=!r||index===filtered.length-1;$('download').disabled=!r;$('query').value=String(index);if(!r){const msg=el('p','該当する回答はありません。表示対象や絞り込みを変更してください。');msg.className='empty';$('content').append(msg);return}if(view==='list')renderList();else if(view==='compare')renderComparison(r);else renderDetail(r)}
for(const name of ['detail','list','compare'])$(`${name}-view`).onclick=()=>{view=name;render()};$('reset').onclick=reset;$('previous').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};$('query').onchange=()=>{index=Number($('query').value);render()};
$('download').onclick=()=>{const r=filtered[index];if(!r)return;const output={...r,sample:sample(r),request:{model:r.model,...data.request_options,messages:sample(r).messages}};const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download=`lag_${r.query_id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
apply();
</script></body></html>
