[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The independent workspace project: legacy LLM-Xavier experiments 00-17, their library
# (mtd_rl_xavier_workspace) and the vendored LLM-Xavier (llm-x-evaluator, src/mentalmodeling).
# It has its own lock and .venv and never imports the core `mtd_rl_xavier` package.
[project]
name = "mtd-rl-xavier-workspace"
version = "0.1.0"
description = "Free-experiment area: LLM-Xavier mental-modelling experiments on RL agents (independent of the core)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "llm-x-evaluator",  # src/mentalmodeling/ (vendored LLM-Xavier, installed editable)
  "numpy>=1.24,<3",
  "openai>=1,<3",
  "pandas>=2,<4",
  "PyYAML>=6",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.26", "pyulog>=1.2", "scipy>=1.11"]
notebook = [
  "jupyterlab>=4,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5,<6",
  "ipykernel>=6,<8",
  "matplotlib>=3.9,<4",
  "pandas>=2",
]
estimation = ["openpyxl>=3.1,<4", "pandas>=2", "scipy>=1.11", "tiktoken==0.14.0"]

[dependency-groups]
dev = ["pytest>=7,<9", "poethepoet>=0.29"]

[tool.uv.sources]
llm-x-evaluator = { path = "src/mentalmodeling", editable = true }

# src/mentalmodeling/ is the separate `llm-x-evaluator` distribution and must not ship here.
# The explicit package-dir keeps the editable install from exposing `src/mentalmodeling/` as `mentalmodeling`.
[tool.setuptools]
packages = [
  "mtd_rl_xavier_workspace",
  "mtd_rl_xavier_workspace.datasets",
  "mtd_rl_xavier_workspace.experiment",
  "mtd_rl_xavier_workspace.experiment.common_analysis",
  "mtd_rl_xavier_workspace.lag",
  "mtd_rl_xavier_workspace.preprocessing",
  "mtd_rl_xavier_workspace.tools",
]

[tool.setuptools.package-dir]
mtd_rl_xavier_workspace = "src/mtd_rl_xavier_workspace"

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
# conftest.py puts the repository root (one level up) on sys.path, so `workspace.<experiment>` imports.
python_files = ["test_*.py"]
norecursedirs = [".*", "results", "node_modules", "__pycache__", "*.egg-info"]

[tool.poe.tasks]
# Library tests and each experiment's tests in separate pytest processes (several experiments reuse
# the same test file names). Run from workspace/: `uv run --project . poe test`.
test-library = { cmd = "pytest -q tests src/mentalmodeling/tests", help = "Library and LLM-Xavier tests" }
test-experiments = { shell = """
status=0
for d in [0-9]*/; do
  echo "== $d"
  pytest -q "$d" || [ $? -eq 5 ] || status=1
done
exit $status
""", help = "Each experiment's tests, one pytest run per experiment" }
test = { sequence = ["test-library", "test-experiments"], help = "Both test sessions" }
